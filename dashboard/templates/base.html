<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Trade Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX and SSE Extension -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        gold: {
                            50: '#fbf8eb',
                            100: '#f5edcb',
                            500: '#f59e0b', // Amber theme
                            600: '#d97706',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        /* Custom scrollbar styling for terminal feel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-gray-100 bg-gray-950 select-none overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="flex-none border-b border-gray-900 bg-gray-950 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded border border-amber-500/30 flex items-center justify-center bg-amber-500/5">
                <i data-lucide="shield" class="w-5 h-5 text-amber-500"></i>
            </div>
            <div>
                <span class="font-mono text-lg font-bold tracking-wider text-amber-500">HERMES</span>
                <span class="text-xs font-mono text-gray-500 px-2 py-0.5 rounded bg-gray-900/50 border border-gray-800 ml-2">AUTONOMOUS</span>
            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <nav class="flex items-center space-x-1 font-mono text-xs">
            <a href="/terminal" class="px-3 py-2 rounded-md flex items-center space-x-1.5 transition {% if active_page == 'terminal' %}text-amber-500 bg-amber-500/5 border border-amber-500/10{% else %}text-gray-400 hover:text-gray-200 hover:bg-gray-900{% endif %}" id="nav-terminal">
                <i data-lucide="terminal" class="w-4 h-4"></i>
                <span>Terminal</span>
            </a>
            <a href="/knowledge" class="px-3 py-2 rounded-md flex items-center space-x-1.5 transition {% if active_page == 'knowledge' %}text-amber-500 bg-amber-500/5 border border-amber-500/10{% else %}text-gray-400 hover:text-gray-200 hover:bg-gray-900{% endif %}" id="nav-knowledge">
                <i data-lucide="library" class="w-4 h-4"></i>
                <span>Knowledge</span>
            </a>
            <a href="/strategy" class="px-3 py-2 rounded-md flex items-center space-x-1.5 transition {% if active_page == 'strategy' %}text-amber-500 bg-amber-500/5 border border-amber-500/10{% else %}text-gray-400 hover:text-gray-200 hover:bg-gray-900{% endif %}" id="nav-strategy">
                <i data-lucide="layers" class="w-4 h-4"></i>
                <span>Strategy Studio</span>
            </a>
            <a href="/trades" class="px-3 py-2 rounded-md flex items-center space-x-1.5 transition {% if active_page == 'trades' %}text-amber-500 bg-amber-500/5 border border-amber-500/10{% else %}text-gray-400 hover:text-gray-200 hover:bg-gray-900{% endif %}" id="nav-trades">
                <i data-lucide="line-chart" class="w-4 h-4"></i>
                <span>Trade Monitor</span>
            </a>
            <a href="/rnd" class="px-3 py-2 rounded-md flex items-center space-x-1.5 transition {% if active_page == 'rnd' %}text-amber-500 bg-amber-500/5 border border-amber-500/10{% else %}text-gray-400 hover:text-gray-200 hover:bg-gray-900{% endif %}" id="nav-rnd">
                <i data-lucide="flask-conical" class="w-4 h-4"></i>
                <span>R&D Lab</span>
            </a>
        </nav>
        
        <!-- Live Clock -->
        <div class="font-mono text-xs text-gray-500 flex items-center space-x-2 bg-gray-900/40 px-3 py-1.5 rounded border border-gray-900">
            <span id="gold-spot-val" class="text-amber-500/60 font-medium">XAUUSD: Loading...</span>
            <span class="text-gray-700">|</span>
            <span id="utc-clock">UTC: --:--:--</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 overflow-hidden relative">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Status Bar -->
    <footer class="flex-none bg-gray-950 border-t border-gray-900 px-6 py-2 flex items-center justify-between text-xs font-mono text-gray-400/80">
        <div class="flex items-center space-x-5" 
             hx-get="/api/status" 
             hx-trigger="load, every 10s" 
             hx-swap="innerHTML">
            <!-- Polled via HTMX -->
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                <span>Hermes RPC: <span class="text-gray-200">Online</span></span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                <span>MT5 Terminal: <span class="text-gray-200">Connected</span></span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                <span>Paper Trader: <span class="text-gray-200">Active</span></span>
            </div>
        </div>

        <div class="flex items-center space-x-4 text-gray-500">
            <span>Stage Lock: <span class="text-amber-500/70">STAGED TRUST</span></span>
            <span>|</span>
            <span>Obsidian Safe</span>
        </div>
    </footer>

    <!-- Initialize Lucide Icons & Clock -->
    <script>
        lucide.createIcons();
        
        // Accurate real-time Clock update
        function updateClock() {
            const now = new Date();
            const utcStr = now.toISOString().slice(11, 19);
            document.getElementById('utc-clock').textContent = `UTC: ${utcStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function updateGoldPrice() {
            try {
                const resp = await fetch('/api/market/price');
                const data = await resp.json();
                const el = document.getElementById('gold-spot-val');
                if (el) {
                    if (data.price && data.price > 0) {
                        el.textContent = `XAUUSD: ${data.price.toFixed(2)}`;
                        el.className = 'text-amber-500 font-medium';
                    } else {
                        el.textContent = 'XAUUSD: MT5 Offline';
                        el.className = 'text-gray-600 font-medium';
                    }
                }
            } catch(e) {
                const el = document.getElementById('gold-spot-val');
                if (el) el.textContent = 'XAUUSD: --';
            }
        }
        setInterval(updateGoldPrice, 5000);
        updateGoldPrice();
    </script>
</body>
</html>
